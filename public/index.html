<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalyani University Portal — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-comic { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .hero-gradient {
      background:
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
        #f8fafc;
    }
    .glass-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    }
    .btn-gradient:hover {
      opacity: 0.95;
    }
  </style>
</head>
<body class="hero-gradient min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Ambient light blobs -->
  <div class="absolute top-12 left-12 w-64 h-64 bg-violet-200/40 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-12 right-12 w-80 h-80 bg-fuchsia-200/40 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">

    <!-- Header Brand (Logo on left, Kalyani University title on right in Comic Sans MS) -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center gap-3 bg-white px-5 py-3.5 rounded-2xl shadow-md border border-slate-200/80 mb-3">
        <img src="/logo.png" alt="Kalyani University Logo" class="h-12 w-auto object-contain shrink-0" />
        <div class="text-left">
          <h1 class="font-comic text-xl font-bold text-slate-900 leading-tight">Kalyani University</h1>
          <p class="text-[11px] text-slate-500 font-medium mt-0.5">Student & Faculty Academic Portal</p>
        </div>
      </div>

      <!-- DeceptiWAF status badge -->
      <div class="flex items-center justify-center mt-1">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-medium">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          Protected by DeceptiWAF Engine v1.4
        </div>
      </div>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-3xl p-8 shadow-xl shadow-slate-200/60">

      <div class="mb-6">
        <h2 class="font-display text-lg font-bold text-slate-800">Account Sign In</h2>
        <p class="text-xs text-slate-500 mt-0.5">Enter your academic credentials to proceed.</p>
      </div>

      <!-- Error Banner -->
      <div id="errorBanner" class="hidden mb-5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl p-3.5 flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mt-0.5 shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText">Invalid student ID or password.</span>
      </div>

      <form action="/login" method="POST" class="space-y-4">

        <div>
          <label for="studentId" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Student ID / Username</label>
          <input type="text" id="studentId" name="studentId" autocomplete="username"
            placeholder="e.g. aryan, sucheta, or admin" required
            class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 text-sm focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none placeholder:text-slate-400 font-medium" />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" autocomplete="current-password"
              placeholder="Enter your password" required
              class="w-full px-4 py-3 pr-11 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 text-sm focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none placeholder:text-slate-400 font-medium" />
            <button type="button" id="togglePassword"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 p-1"
              title="Toggle password visibility">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-gradient w-full text-white font-semibold py-3 rounded-xl text-sm shadow-md mt-2">
          Sign In to Portal &rarr;
        </button>
      </form>

      <!-- Demo Quick Fill Chips -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-2">⚡ Demo Quick Presets</p>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" onclick="quickFill('aryan', 'aryan@2024')" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-semibold border border-indigo-200/80 hover:bg-indigo-100 active:bg-indigo-200">
            👨‍🎓 Student: aryan
          </button>
          <button type="button" onclick="quickFill('sucheta', 'sucheta@2024')" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-semibold border border-indigo-200/80 hover:bg-indigo-100 active:bg-indigo-200">
            👩‍🎓 Student: sucheta
          </button>
          <button type="button" onclick="quickFill('admin', 'socadmin123')" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-700 text-xs font-semibold border border-rose-200/80 hover:bg-rose-100 active:bg-rose-200">
            🛠️ Admin: SOC
          </button>
        </div>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="flex items-center justify-between text-xs text-slate-500 mt-6 px-2">
      <span>&copy; 2025 Kalyani University</span>
      <div class="flex items-center gap-3">
        <a href="/test" class="text-indigo-600 font-semibold hover:underline flex items-center gap-1">
          <span>🚀 Cyber Range</span>
        </a>
        <span>&middot;</span>
        <a href="/soc" class="text-slate-600 hover:text-slate-900">SOC Login</a>
      </div>
    </div>

  </div>

  <script>
    function quickFill(user, pass) {
      document.getElementById('studentId').value = user;
      document.getElementById('password').value = pass;
    }

    (function () {
      const err = new URLSearchParams(window.location.search).get('error');
      const banner = document.getElementById('errorBanner');
      const text = document.getElementById('errorText');
      if (err) {
        banner.classList.remove('hidden');
        if (err === 'invalid')      text.textContent = 'Invalid Student ID or password.';
        else if (err === 'missing') text.textContent = 'Please enter both Student ID and password.';
        else if (err === 'auth')    text.textContent = 'Session expired or unauthorized access. Please sign in.';
        else                        text.textContent = 'Login attempt failed. Please try again.';
      }

      const passInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');
      toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text'; eyeOpen.style.display = 'none'; eyeClosed.style.display = 'block';
        } else {
          passInput.type = 'password'; eyeOpen.style.display = 'block'; eyeClosed.style.display = 'none';
        }
      });
    })();
  </script>
</body>
</html>
